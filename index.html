<style>
  :root {
    --navy: #1b2f6b;
    --blue: #2856b8;
    --steel: #5f6b7a;
    --silver: #c9d0d9;
    --text: #2b3340;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 0 24px;
  }
  .logo {
    width: min(340px, 78vw);
    height: auto;
    display: block;
  }
  .progress {
    width: 180px;
    height: 3px;
    background: #e8ecf2;
    border-radius: 3px;
    overflow: hidden;
    margin: 28px 0 32px;
  }
  .progress span {
    display: block;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, var(--navy), var(--blue));
    border-radius: 3px;
    animation: slide 2.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(260%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress span { animation: none; width: 60%; }
  }
  .lang + .lang {
    margin-top: 26px;
    padding-top: 26px;
    border-top: 1px solid #eef1f5;
    width: 100%;
  }
  h1 {
    font-size: clamp(1.35rem, 4.5vw, 1.75rem);
    font-weight: 600;
    color: var(--navy);
    letter-spacing: 0.01em;
  }
  .lang[lang="en"] h1 {
    font-size: clamp(1.15rem, 3.8vw, 1.4rem);
    font-weight: 500;
    color: var(--steel);
  }
  .lang p {
    margin-top: 10px;
    font-size: 0.98rem;
    line-height: 1.6;
    font-weight: 400;
  }
  .lang[lang="en"] p { color: var(--steel); }
  /* Marka cümlesi buraya eklenecek / Brand sentence will be added here */
  .contact {
    margin-top: 36px;
    font-size: 0.92rem;
    color: var(--steel);
  }
  .contact a {
    display: inline-block;
    margin-top: 6px;
    color: var(--blue);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--silver);
    padding-bottom: 2px;
    word-break: break-all;
  }
  .contact a:hover { border-bottom-color: var(--blue); }
  footer {
    width: 100%;
    max-width: 640px;
    text-align: center;
    padding: 20px 0 24px;
    font-size: 0.78rem;
    color: #8a94a3;
    letter-spacing: 0.04em;
  }
  .ver { margin-left: 8px; opacity: 0.7; }
</style>
</head>
